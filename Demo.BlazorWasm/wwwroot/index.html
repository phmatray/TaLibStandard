<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaLibStandard — technical analysis for .NET</title>
    <meta name="description" content="A C# port of TA-Lib: 159 indicator and candlestick entry points, generic math over double, float and decimal, no native dependencies." />
    <base href="/" />

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#eef1f4" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Demo.BlazorWasm.styles.css" rel="stylesheet" />

    <script>
        // Set the theme before first paint so the page never flashes the wrong surface.
        (function () {
            var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-content">
                <h1 class="loading-title">TaLibStandard</h1>
                <p class="loading-subtitle">Technical analysis for .NET</p>
                <div class="loading-bar"><span></span></div>
                <p class="loading-progress-text">Loading the runtime…</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/d3-charts.js"></script>
    <script src="js/site.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
